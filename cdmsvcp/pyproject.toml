[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdmsvcp"
version = "0.1.0"
description = "Edit Distance to Full Flat-Foldability at a Single Vertex (Kawasaki + Maekawa)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "cdsvcp",
    "pytest>=9.0",
]

[project.optional-dependencies]
dev   = ["pytest>=7.0"]
plots = ["matplotlib>=3.7"]

[project.scripts]
cdmsvcp = "cdmsvcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cdmsvcp*"]
