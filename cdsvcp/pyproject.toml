[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdsvcp"
version = "0.1.0"
description = "Combinatorial Edit Distance for Single-Vertex Crease Patterns (TwoInsert algorithm)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pytest>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cdsvcp = "cdsvcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cdsvcp*"]
