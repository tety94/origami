[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdsvcp"
version = "0.1.0"
description = "Geometric Edit Distance for Single-Vertex Crease Patterns under L2"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pytest>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gdsvcp = "gdsvcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gdsvcp*"]
